name: Bug report
description: Report a reproducible behavior problem using fictional data.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "For suspected vulnerabilities, use the private Security reporting route. Never include credentials, cookies, or .local files."
  - type: input
    id: revision
    attributes:
      label: Revision and environment
      description: Commit or tag, browser, and native or Compose setup.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Use the fictional fixture accounts; do not include their passwords.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Optional correlation ID or screenshot without private data.
