version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      dotnet:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /src/AccessLab.Web
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      frontend:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /tests/e2e
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      acceptance:
        patterns: ["*"]
        update-types: [minor, patch]
